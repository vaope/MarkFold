[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "markfold"
version = "0.1.0"
description = "LLM-assisted personal work item memory in Markdown."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "MarkFold" }
]
dependencies = [
  "alembic>=1.16.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.0",
  "openai>=1.0.0",
  "protobuf>=5.29.0",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.0",
  "typer>=0.16.0",
  "uvicorn[standard]>=0.35.0",
  "websockets>=15.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=6.0.0",
]

[project.scripts]
markfold = "markfold.cli:app"
markfold-api = "markfold.api.app:run"
markfold-feishu = "markfold.feishu_worker:run"

[tool.hatch.build.targets.wheel]
packages = ["src/markfold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = true
